<!doctype html>
<html lang="en-us">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<title>Toost | Super Mario Maker 2 Level Viewer</title>
	<style>
		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			background-color: #1a1a1a;
			color: #e0e0e0;
			font-family: "Segoe UI", Arial, sans-serif;
			overflow: hidden;
		}

		#layout {
			display: flex;
			flex-direction: column;
			width: 100vw;
			height: 100vh;
		}

		#topbar {
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			gap: 6px 8px;
			padding: 6px 10px;
			background-color: #26211d;
			border-bottom: 2px solid #3a332c;
		}

		#topbar h1 {
			font-size: 15px;
			margin: 0 4px 0 0;
			color: #ffb84d;
		}

		#topbar button,
		#topbar select,
		#topbar input[type="text"],
		#topbar input[type="number"] {
			padding: 4px 8px;
			background-color: #191512;
			color: #e0e0e0;
			border: 1px solid #6a5c4e;
			border-radius: 4px;
			font-size: 12px;
		}

		#topbar button {
			cursor: pointer;
		}

		#topbar button:hover:not(:disabled) {
			background-color: #5c5044;
		}

		#topbar button:disabled {
			opacity: 0.5;
			cursor: default;
		}

		#topbar input#levelId {
			width: 110px;
			font-size: 13px;
		}

		#topbar input#imageScale {
			width: 52px;
		}

		#topbar .chk {
			display: flex;
			align-items: center;
			gap: 3px;
			font-size: 12px;
			color: #c9c2ba;
			cursor: pointer;
			user-select: none;
		}

		#topbar .chk input:disabled + span {
			opacity: 0.45;
		}

		#topbar .sep {
			width: 1px;
			height: 22px;
			background: #3a332c;
		}

		/* forced line break: row 1 = discovery, row 2 = display controls */
		#topbar .rowbreak {
			flex-basis: 100%;
			height: 0;
			border-top: 1px solid #3a332c;
		}

		.btnrow {
			display: flex;
			gap: 6px;
		}

		#info {
			margin-top: 14px;
			font-size: 12px;
			line-height: 1.5;
			color: #b8b0a6;
			word-wrap: break-word;
		}

		#info .row {
			margin-bottom: 2px;
		}

		#info .user {
			display: flex;
			align-items: flex-start;
			gap: 8px;
		}

		#info img.mii {
			width: 36px;
			height: 36px;
			border-radius: 50%;
			background-color: #444;
			flex: 0 0 auto;
		}

		#info .ucode {
			color: #8fb3d9;
			font-size: 11px;
			letter-spacing: 1px;
			margin-bottom: 3px;
		}

		#info .ctry {
			color: #7fbf8f;
			font-weight: normal;
		}

		#info .ufield {
			font-size: 11.5px;
			color: #a8a099;
		}

		#info .error {
			color: #ff7a6b;
		}

		#info .userlink {
			color: #8fb3d9;
			cursor: pointer;
			text-decoration: underline dotted;
		}

		#info .userlink:hover {
			color: #b8d4ee;
		}

		#info .statgrid {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 2px 10px;
			margin: 6px 0;
		}

		#info .levellist {
			margin-top: 6px;
		}

		#info .levellist button {
			display: block;
			width: 100%;
			text-align: left;
			margin: 3px 0;
			padding: 5px 8px;
			background-color: #3a332c;
			color: #e0e0e0;
			border: 1px solid #55493d;
			border-radius: 4px;
			cursor: pointer;
			font-size: 12px;
		}

		#info .levellist button:hover {
			background-color: #4a4038;
		}

		#info .levellist .lmeta {
			color: #a8a099;
			font-size: 11px;
		}

		#info .backbtn {
			margin-bottom: 8px;
		}

		#info h2 {
			font-size: 14px;
			color: #ffb84d;
			margin: 10px 0 4px 0;
		}

		#stage {
			flex: 1;
			position: relative;
			background-color: #111;
		}

		#canvas {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			touch-action: none;
			user-select: none;
			-webkit-user-select: none;
		}

		/* ---- canvas HUD ---- */
		#topbar .focgrp {
			display: flex;
			gap: 4px;
		}

		#topbar .focgrp button {
			padding: 3px 10px;
			font-size: 11px;
			letter-spacing: 1px;
		}

		#topbar .focgrp button.active {
			background: #5c5044;
			color: #ffd9a0;
			border-color: #ffb84d;
		}

		#topbar #topLevelName {
			flex: 0 1 auto;
			min-width: 0;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
			font-size: 13px;
			color: #e8dfd2;
		}

		#topbar .nightbadge {
			color: #9db8d9;
			font-size: 11px;
			border: 1px solid #44506a;
			border-radius: 8px;
			padding: 1px 8px;
		}

		#topbar #topReset {
			padding: 3px 10px;
			font-size: 12px;
		}

		/* compact uploader card; hover expands to the full trio below it */
		#topUserWrap {
			position: relative;
			display: none;
		}

		#topUserWrap .tucard {
			display: flex;
			align-items: center;
			gap: 6px;
			max-width: 230px;
			padding: 3px 10px;
			background-color: #191512;
			border: 1px solid #6a5c4e;
			border-radius: 15px;
		}

		#topUserWrap .tucard.userlink {
			cursor: pointer;
		}

		#topUserWrap .tucard.userlink:hover {
			background-color: #5c5044;
		}

		#topUserWrap img.mii {
			width: 24px;
			height: 24px;
			border-radius: 50%;
			background-color: #444;
			flex: 0 0 auto;
		}

		#topUserWrap .ucol {
			display: flex;
			flex-direction: column;
			line-height: 1.25;
			min-width: 0;
		}

		#topUserWrap .uname {
			font-size: 12px;
			color: #e8dfd2;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		#topUserWrap .ctry {
			color: #7fbf8f;
			font-weight: normal;
		}

		#topUserWrap .ucode {
			font-size: 10px;
			color: #8fb3d9;
			letter-spacing: 1px;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		#topUserWrap .tumenu {
			display: none;
			position: absolute;
			top: 100%;
			right: 0;
			/* padding (not margin) keeps the hover bridge to the card unbroken */
			padding-top: 5px;
			z-index: 30;
		}

		#topUserWrap:hover .tumenu {
			display: block;
		}

		.tumenuin {
			width: 230px;
			display: flex;
			flex-direction: column;
			gap: 10px;
			padding: 8px;
			background: rgba(38, 33, 29, 0.97);
			border: 1px solid #3a332c;
			border-radius: 8px;
			box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
		}

		.tub {
			display: flex;
			align-items: flex-start;
			gap: 8px;
			font-size: 12px;
			color: #e0e0e0;
		}

		.tub img.mii {
			width: 24px;
			height: 24px;
			border-radius: 50%;
			background-color: #444;
			flex: 0 0 auto;
		}

		.tub .mulabel {
			font-size: 9.5px;
			text-transform: uppercase;
			letter-spacing: 1px;
			color: #a89f93;
		}

		.tub .ucode {
			font-size: 10px;
			color: #8fb3d9;
			letter-spacing: 1px;
		}

		.tub .ufield {
			font-size: 11px;
			color: #a8a099;
		}

		.tub .userlink {
			color: #8fb3d9;
			cursor: pointer;
			text-decoration: underline dotted;
		}

		.tub .userlink:hover {
			color: #b8d4ee;
		}

		.tustats {
			border-top: 1px solid #3a332c;
			padding-top: 8px;
		}

		.tsgrid {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 1px 10px;
		}

		.tsi {
			font-size: 11px;
			color: #a8a099;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}

		.tsi.wide {
			grid-column: 1 / -1;
		}

		#canvasWrap {
			position: absolute;
			inset: 0;
		}

		#infoPanel {
			position: absolute;
			right: 8px;
			top: 8px;
			width: 300px;
			max-height: calc(100% - 16px);
			overflow-y: auto;
			background: rgba(38, 33, 29, 0.96);
			border: 1px solid #3a332c;
			border-radius: 8px;
			padding: 10px;
			z-index: 6;
			box-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
		}

		#infoClose {
			position: absolute;
			top: 4px;
			right: 6px;
			background: none;
			border: none;
			color: #c9c2ba;
			font-size: 14px;
			cursor: pointer;
		}

		#infoClose:hover {
			color: #ffb84d;
		}

		.exprow {
			position: absolute;
			left: 8px;
			display: flex;
			gap: 4px;
			z-index: 5;
		}

		.exprow button {
			padding: 2px 8px;
			font-size: 11px;
			color: #f0e8dc;
			background: rgba(60, 50, 40, 0.85);
			border: 1px solid rgba(255, 200, 120, 0.35);
			border-radius: 4px;
			cursor: pointer;
		}

		.exprow button:hover:not(:disabled) {
			background: rgba(60, 50, 40, 0.9);
		}

		.exprow button:disabled {
			opacity: 0.4;
			cursor: default;
		}

		.vplabel {
			position: absolute;
			left: 10px;
			font-size: 11px;
			letter-spacing: 1px;
			color: #ddd;
			background: rgba(20, 20, 20, 0.55);
			border: 1px solid rgba(255, 255, 255, 0.15);
			border-radius: 10px;
			padding: 2px 10px;
			pointer-events: auto;
			cursor: pointer;
			user-select: none;
			z-index: 3;
		}

		.minimap {
			position: absolute;
			left: 10px;
			border: 1px solid rgba(255, 255, 255, 0.25);
			border-radius: 4px;
			background: #1a1a1a;
			cursor: crosshair;
			z-index: 3;
			box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
		}

		#splitter {
			position: absolute;
			left: 0;
			right: 0;
			height: 12px;
			margin-top: -6px;
			cursor: row-resize;
			z-index: 4;
			/* invisible: the divider line itself is drawn by the canvas render */
		}

		#coords {
			position: absolute;
			right: 10px;
			bottom: 8px;
			font-size: 12px;
			color: #999;
			pointer-events: none;
		}

		#bubble {
			position: absolute;
			display: none;
			max-width: 240px;
			background: #f4f0e8;
			color: #222;
			font-size: 12px;
			line-height: 1.4;
			padding: 6px 8px;
			border-radius: 8px;
			border: 1px solid #c8bfae;
			box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
			pointer-events: none;
			z-index: 5;
		}

		#bubble .meta {
			color: #8a7f6d;
			font-size: 11px;
			margin-top: 2px;
		}

		#loading {
			position: fixed;
			inset: 0;
			display: flex;
			justify-content: center;
			align-items: center;
			background-color: #805438;
			font-size: 22px;
			z-index: 10;
		}
	</style>
</head>

<body>
	<div id="loading">Loading...</div>
	<div id="layout">
		<div id="topbar">
			<h1>Toost</h1>
			<button id="loadBtn" disabled title="Load a local level file">📁 Load</button>
			<input type="file" id="fileInput" style="display: none">
			<input type="text" id="levelId" maxlength="14" placeholder="Level ID" autocomplete="off">
			<button id="downloadBtn" disabled>Download</button>

			<span class="sep"></span>
			<select id="randomSource" title="Random pool">
				<option value="new">New</option>
				<option value="popular" selected>Popular</option>
				<option value="endless">Endless</option>
			</select>
			<select id="randomDifficulty" title="Difficulty filter">
				<option value="">Any</option>
				<option value="e">Easy</option>
				<option value="n">Normal</option>
				<option value="ex">Expert</option>
				<option value="sex">Super Exp.</option>
			</select>
			<button id="randomBtn" disabled title="Load a random level">🎲</button>

			<span class="sep"></span>
			<button id="liveHotBtn" disabled title="Load the hottest level being watched right now">🔥 Hot</button>
			<button id="liveListBtn" disabled title="Show what is being watched right now">Live list</button>

			<span class="rowbreak"></span>
			<label class="chk" title="Hide the tile grid"><input type="checkbox" id="removeGrid"><span>Grid</span></label>
			<label class="chk" title="Render objects above pipes"><input type="checkbox" id="objectsOverPipes"><span>Pipes</span></label>
			<label class="chk" title="Death heatmap overlay"><input type="checkbox" id="deathsOverlay" disabled><span>Deaths</span></label>
			<label class="chk" title="Comment pin overlay"><input type="checkbox" id="commentsOverlay" disabled><span>Pins</span></label>
			<label class="chk" title="Overlay the official render"><input type="checkbox" id="compareOfficial" disabled><span>Compare</span></label>
			<input type="number" id="imageScale" value="1" min="0.125" max="8" step="0.125" title="PNG export scale">

			<span class="sep"></span>
			<div class="focgrp">
				<button id="focusOver" title="Give the overworld most of the height">OVER</button>
				<button id="focusSplit" class="active" title="Split the view 50 / 50">SPLIT</button>
				<button id="focusSub" title="Give the subworld most of the height">SUB</button>
			</div>
			<button id="topReset" title="Reset both viewports (R)">⟲</button>

			<span id="topLevelName"></span>
			<span class="nightbadge" id="topNight" style="display: none">🌙 night</span>
			<div id="topUserWrap"></div>
			<button id="infoBtn" style="margin-left: auto" title="Toggle the info panel">ℹ Info</button>
		</div>
		<div id="stage">
			<div id="canvasWrap">
				<canvas id="canvas"></canvas>
				<div id="infoPanel">
					<button id="infoClose" title="Close panel">×</button>
					<div id="info"><div class="row">Load a level to see info.</div></div>
				</div>
				<div class="exprow" id="exportOw" style="display: none">
					<button id="saveOwPng" disabled>PNG</button>
					<button id="saveOwJson" disabled>JSON</button>
				</div>
				<div class="exprow" id="exportSw" style="display: none">
					<button id="saveSwPng" disabled>PNG</button>
					<button id="saveSwJson" disabled>JSON</button>
				</div>
				<canvas class="minimap" id="miniOw" width="140" height="40" style="display: none"></canvas>
				<canvas class="minimap" id="miniSw" width="140" height="40" style="display: none"></canvas>
				<div id="splitter" style="display: none"></div>
				<div id="bubble"></div>
				<div id="coords"></div>
			</div>
		</div>
	</div>
		</div>
	</div>

	<script type="module">
		const $ = (id) => document.getElementById(id);
		const canvas = $('canvas');
		const ctx = canvas.getContext('2d');

		const TILE = 16;
		let viewSplit = 0.5; // fraction of canvas height given to the overworld viewport
		const worlds = [0, 1].map(() => ({
			bitmap: null, png: null, width: 0, height: 0,
			scale: 1, offX: 0, offY: 0,
			hoverTile: null
		}));
		const worldNames = ['overworld', 'subworld'];

		let ex = null; // wasm instance exports
		let currentLevelBytes = null;
		let currentLevelCode = null; // set when loaded by ID; gates the API-backed overlays
		let onlineInfo = null;
		let dragging = false;
		let dragLast = { x: 0, y: 0 };
		let drawQueued = false;

		// overlays: per-world {bitmap, marks}; data comes from tgrcode and is
		// rendered into transparent PNGs by the wasm core
		const overlays = [0, 1].map(() => ({ bitmap: null, marks: [] }));
		let officialThumb = null; // Image, official 1/3-scale overworld render
		let levelIsNight = false;
		let wasmClearTime = null; // "Clear time" row of the wasm info html, for the topbar card
		let infoPanelDismissed = false; // manual close sticks until the next level load
		const apiCache = new Map();

		const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

		function queueDraw() {
			if (drawQueued) return;
			drawQueued = true;
			requestAnimationFrame(() => { drawQueued = false; draw(); });
		}

		function draw() {
			ctx.fillStyle = '#141414';
			ctx.fillRect(0, 0, canvas.width, canvas.height);

			const hCut = Math.round(canvas.height * viewSplit);
			worlds.forEach((w, i) => {
				const { vy, vh } = viewportRect(i);

				if (i === 1) {
					ctx.fillStyle = '#404040';
					ctx.fillRect(0, vy - 1, canvas.width, 2);
				}
				if (!w.bitmap) return;

				// each world stays inside its own half
				ctx.save();
				ctx.beginPath();
				ctx.rect(0, vy, canvas.width, vh);
				ctx.clip();
				ctx.imageSmoothingEnabled = false;
				ctx.drawImage(w.bitmap, w.offX, vy + w.offY, w.width * w.scale, w.height * w.scale);

				// death heatmap + comment pins, rendered by the wasm core as a
				// transparent PNG sharing the level's pixel grid
				if (overlays[i].bitmap) {
					ctx.drawImage(overlays[i].bitmap, w.offX, vy + w.offY, w.width * w.scale, w.height * w.scale);
				}

				// official entire thumbnail is the overworld at exactly 1/3 scale,
				// so it aligns with the rendered rectangle pixel-for-pixel
				if (i === 0 && $('compareOfficial').checked && officialThumb) {
					ctx.globalAlpha = 0.5;
					ctx.drawImage(officialThumb, w.offX, vy + w.offY, w.width * w.scale, w.height * w.scale);
					ctx.globalAlpha = 1;
				}

				if (w.hoverTile) {
					ctx.fillStyle = 'rgba(255, 215, 40, 0.4)';
					ctx.fillRect(
						w.offX + w.hoverTile.x * TILE * w.scale,
						vy + w.offY + w.hoverTile.y * TILE * w.scale,
						TILE * w.scale, TILE * w.scale);
				}
				ctx.restore();
			});
			renderMinimaps(hCut);
		}

		function fitView(w, vy, vh) {
			if (!w.bitmap) return;
			// fit the whole level inside its viewport so start and goal are visible
			w.scale = Math.min(canvas.width / w.width, vh / w.height);
			w.offX = (canvas.width - w.width * w.scale) / 2;
			w.offY = (vh - w.height * w.scale) / 2;
		}

		function clampView(w, vy, vh) {
			if (!w.bitmap) return;
			const contain = Math.min(canvas.width / w.width, vh / w.height);
			w.scale = Math.min(Math.max(w.scale, contain * 0.4), 12);
			const drawW = w.width * w.scale, drawH = w.height * w.scale;
			w.offX = drawW <= canvas.width ? (canvas.width - drawW) / 2 : Math.min(Math.max(w.offX, canvas.width - drawW), 0);
			w.offY = drawH <= vh ? (vh - drawH) / 2 : Math.min(Math.max(w.offY, vh - drawH), 0);
		}

		// viewport geometry: overworld spans [0, hCut), subworld [hCut, H)
		function viewportRect(i) {
			const hCut = Math.round(canvas.height * viewSplit);
			return i === 0 ? { vy: 0, vh: hCut } : { vy: hCut, vh: canvas.height - hCut };
		}

		function worldAt(my) {
			const hCut = Math.round(canvas.height * viewSplit);
			const i = my < hCut ? 0 : 1;
			const r = viewportRect(i);
			return { i, vy: r.vy, vh: r.vh };
		}

		// ------------------------------------------------------------------
		// WASM bridge. The core is a plain wasi-sdk reactor module; the
		// imports below are the only WASI calls it makes (stdio, clock, env),
		// so a tiny shim replaces a full WASI runtime in the browser.
		// ------------------------------------------------------------------

		const heap = () => new Uint8Array(ex.memory.buffer);

		function cstr(ptr) {
			const h = heap();
			let end = ptr;
			while (h[end] !== 0) end++;
			return new TextDecoder().decode(h.subarray(ptr, end));
		}

		const wasi = {
			environ_sizes_get: (countPtr, bufSizePtr) => {
				const dv = new DataView(ex.memory.buffer);
				dv.setUint32(countPtr, 0, true);
				dv.setUint32(bufSizePtr, 0, true);
				return 0;
			},
			environ_get: () => 0,
			clock_time_get: (clk, precision, timePtr) => {
				new DataView(ex.memory.buffer).setBigUint64(timePtr, BigInt(Math.round(performance.now() * 1e6)), true);
				return 0;
			},
			// stdout/stderr: collect the bytes, report them as written, log to console
			fd_write: (fd, iovs, iovsLen, nwrittenPtr) => {
				const dv = new DataView(ex.memory.buffer);
				const h = heap();
				let total = 0, text = '';
				for (let i = 0; i < iovsLen; i++) {
					const p = dv.getUint32(iovs + i * 8, true);
					const len = dv.getUint32(iovs + i * 8 + 4, true);
					total += len;
					text += new TextDecoder().decode(h.subarray(p, p + len));
				}
				dv.setUint32(nwrittenPtr, total, true);
				const line = text.trim();
				if (line) console.log('[wasm]', line);
				return 0;
			},
			fd_fdstat_get: (fd, buf) => {
				// character device (no preopens exist in this module)
				new DataView(ex.memory.buffer).setUint8(buf, 2);
				return 0;
			},
			fd_prestat_get: () => 8, // EBADF: no preopened dirs
			fd_prestat_dir_name: () => 8,
			fd_read: () => 8,
			fd_seek: () => 8,
			fd_close: () => 0,
			proc_exit: (code) => { throw new Error('wasm proc_exit(' + code + ')'); },
		};

		async function loadWasm() {
			// brotli-compressed module when the browser can stream-decode it
			// (cuts the module from ~620KB to ~150KB on the wire)
			const canBrotli = typeof DecompressionStream === 'function'
				&& (() => { try { new DecompressionStream('br'); return true; } catch { return false; } })();
			const resp = await fetch(canBrotli ? 'toost.wasm.br' : 'toost.wasm');
			if (!resp.ok) throw new Error('toost.wasm: HTTP ' + resp.status);
			let module;
			if (canBrotli) {
				const stream = resp.body.pipeThrough(new DecompressionStream('br'));
				module = await WebAssembly.compile(await new Response(stream).arrayBuffer());
			} else {
				module = await WebAssembly.compile(await resp.arrayBuffer());
			}
			const instance = await WebAssembly.instantiate(module, { wasi_snapshot_preview1: wasi });
			instance.exports._initialize();
			return instance.exports;
		}

		// Assets (tilesheets, spritesheet) are fetched from the server and passed
		// to the core as PNG bytes via web_set_asset; kind 0/1 = tilesheets, 2 = spritesheet.
		const assetCache = new Map();
		async function fetchAsset(kind, url) {
			let bytes = assetCache.get(url);
			if (!bytes) {
				const resp = await fetch(url);
				if (!resp.ok) throw new Error('asset ' + url + ': HTTP ' + resp.status);
				bytes = new Uint8Array(await resp.arrayBuffer());
				assetCache.set(url, bytes);
			}
			const p = ex.malloc(bytes.length);
			heap().set(bytes, p);
			const rc = ex.web_set_asset(kind, p, bytes.length);
			ex.free(p);
			if (rc !== 0) throw new Error('web_set_asset(' + kind + ') failed');
		}

		// ------------------------------------------------------------------
		// Overlays (deaths / comments) and the official-render comparison.
		// All geometry lives in the wasm core; the frontend only fetches,
		// passes JSON through, and composites the returned transparent PNGs.
		// ------------------------------------------------------------------

		async function fetchCachedJson(url) {
			if (!apiCache.has(url)) {
				let r = await fetch(url);
				if (r.status === 429) {
					// API rate limits behind nginx; back off once before giving up
					await new Promise(res => setTimeout(res, 3000));
					r = await fetch(url);
				}
				if (!r.ok) throw new Error('HTTP ' + r.status);
				apiCache.set(url, await r.json());
			}
			return apiCache.get(url);
		}

		async function passJson(obj) {
			const bytes = new TextEncoder().encode(JSON.stringify(obj));
			const p = ex.malloc(bytes.length);
			heap().set(bytes, p);
			return [p, bytes.length];
		}

		async function refreshOverlays() {
			const deathsOn = $('deathsOverlay').checked;
			const commentsOn = $('commentsOverlay').checked;
			if (!currentLevelCode || (!deathsOn && !commentsOn)) {
				overlays.forEach(o => { o.bitmap = null; o.marks = []; });
				$('bubble').style.display = 'none';
				queueDraw();
				return;
			}
			try {
				if (deathsOn) {
					const d = await fetchCachedJson(`https://tgrcode.com/mm2/level_deaths/${currentLevelCode}`);
					ex.web_set_deaths(...await passJson(d.deaths));
				}
				let comments = [];
				if (commentsOn) {
					const c = await fetchCachedJson(`https://tgrcode.com/mm2/level_comments/${currentLevelCode}`);
					comments = (c.comments || []).map(m => ({
						x: m.x, y: m.y, t: m.text || '', p: m.poster?.name || '',
						w: m.posted_pretty || '', ty: m.reaction_face_name || m.type_name || 'Comment',
						b: m.has_beaten ? 1 : 0
					}));
					ex.web_set_comments(...await passJson(comments));
				}
				for (const world of [0, 1]) {
					const size = ex.web_render_overlay(world, deathsOn ? 1 : 0, commentsOn ? 1 : 0);
					if (size <= 0) { overlays[world].bitmap = null; continue; }
					const ptr = ex.web_get_result();
					const png = heap().slice(ptr, ptr + size);
					overlays[world].bitmap = await createImageBitmap(new Blob([png], { type: 'image/png' }));
					overlays[world].marks = commentsOn ? JSON.parse(cstr(ex.web_get_comment_marks(world))) : [];
				}
				queueDraw();
			} catch (err) {
				console.warn('overlay load failed:', err.message);
			}
		}

		async function renderWorld(i) {
			const size = ex.web_render_level(i);
			if (size <= 0) throw new Error('render failed');
			const ptr = ex.web_get_result();
			const png = heap().slice(ptr, ptr + size);

			const w = worlds[i];
			if (w.bitmap) URL.revokeObjectURL(w.url ?? '');
			w.png = png;
			w.url = URL.createObjectURL(new Blob([png], { type: 'image/png' }));
			w.bitmap = await createImageBitmap(new Blob([png], { type: 'image/png' }));
			w.width = w.bitmap.width;
			w.height = w.bitmap.height;

			const { vy, vh } = viewportRect(i);
			fitView(w, vy, vh);
		}

		async function loadFromBytes(bytes, code = null) {
			currentLevelBytes = bytes;
			currentLevelCode = code;
			$('info').innerHTML = "<div class='row'>Rendering...</div>";
			enableSaveButtons(false);
			overlays.forEach(o => { o.bitmap = null; o.marks = []; });
			officialThumb = null;
			wasmClearTime = null;
			infoPanelDismissed = false;
			$('bubble').style.display = 'none';
			await new Promise(r => setTimeout(r, 30)); // let the UI update before the sync render

			const p = ex.malloc(bytes.length);
			heap().set(bytes, p);
			const rc = ex.web_load_level(p, bytes.length);
			ex.free(p);
			if (rc !== 0) {
				$('info').innerHTML = "<div class='error'>Not a valid level file</div>";
				return;
			}
			const infoHtml = cstr(ex.web_get_info_html());
			levelIsNight = /Night: yes/.test(infoHtml);
			wasmClearTime = (infoHtml.match(/Clear time: ([^<]*)/) || '')[1] || null;

			// make sure both worlds' tilesheets and the spritesheet are available
			await fetchAsset(2, 'img/spritesheet.png');
			for (const w of [0, 1]) {
				const sheet = cstr(ex.web_tilesheet_path(w));
				if (sheet) await fetchAsset(w, sheet);
			}

			await renderWorld(0);
			await renderWorld(1);
			$('info').innerHTML = buildInfo(cstr(ex.web_get_info_html()), onlineInfo);
			enableSaveButtons(true);
			['deathsOverlay', 'commentsOverlay', 'compareOfficial'].forEach(id => $(id).disabled = !code);
			layoutHud();
			if (!infoPanelDismissed) openInfoPanel();
			queueDraw();

			refreshOverlays();
			if (code) {
				history.replaceState(null, '', '?level=' + code);
				// official entire thumbnail = overworld at exactly 1/3 scale; prefetch
				const img = new Image();
				img.src = `https://tgrcode.com/mm2/level_entire_thumbnail/${code}`;
				img.decode().then(() => { officialThumb = img; queueDraw(); }).catch(() => {});
			} else {
				history.replaceState(null, '', location.pathname);
			}
		}

		// ------------------------------------------------------------------
		// Sidebar info assembly. Online metadata (level_info endpoint) drives
		// the grouping: difficulty/tags under the description, level stats
		// under the uploader, record time under the record holder.
		// ------------------------------------------------------------------

		const row = (label, value) => `<div class='row'>${label}: <b>${esc(value)}</b></div>`;

		const formatCode = (c) => (c && c.length === 9) ? c.replace(/^(.{3})(.{3})(.{3})$/, '$1-$2-$3') : (c || '');

		function buildInfo(baseHtml, info) {
			// wasm rows: [0]=name, [1]=description, then style/theme/.../clear time/...
			let rows = baseHtml.split(/(?=<div)/).map(s => s.trim()).filter(Boolean);

			// Clear time belongs to the topbar hover card when online info exists
			rows = rows.filter(r => !(info && /Clear time: /.test(r)));

			// difficulty and tags go right under the description, condition follows
			if (info) {
				const extra = [];
				if (info.difficulty_name) extra.push(row('Difficulty', info.difficulty_name));
				if (info.tags_name) {
					const tags = info.tags_name.filter(t => t && t !== 'None').join(', ');
					if (tags) extra.push(row('Tags', tags));
				}
				rows = rows.filter(r => {
					if (r.includes('Condition:')) { extra.push(r); return false; }
					return true;
				});
				rows.splice(2, 0, ...extra);
			}

			// uploader / first clear / world record / stats all live in the
			// topbar user card's hover menu now
			return rows.join('');
		}

		// compact uploader card for the topbar; hovering expands to the full
		// uploader / first-clear / world-record trio. Entries reuse .userlink
		// so the shared delegated click handler opens the maker profile.
		function buildTopUser() {
			const info = onlineInfo;
			if (!info?.uploader?.name) return '';
			const up = info.uploader;
			const ctry = (u) => u.country ? `<span class="ctry">[${esc(u.country)}]</span> ` : '';
			const mii = (u) => u.mii_image
				? `<img class="mii" src="${esc(u.mii_image)}" referrerpolicy="no-referrer" onerror="this.remove()">`
				: '';
			const code = up.code || '';
			const card =
				(code ? `<div class="tucard userlink" data-code="${esc(code)}" title="View maker profile">` : `<div class="tucard">`) +
				mii(up) +
				`<span class="ucol"><span class="uname">${ctry(up)}${esc(up.name)}</span>` +
				(code ? `<span class="ucode">${esc(formatCode(code))}</span>` : '') +
				`</span></div>`;
			const entry = (label, u, extra) => {
				if (!u || !u.name) return '';
				const who = u.code
					? `<b class="userlink" data-code="${esc(u.code)}" title="View maker profile">${ctry(u)}${esc(u.name)}</b>` +
						`<div class="ucode">${esc(formatCode(u.code))}</div>`
					: `<b>${ctry(u)}${esc(u.name)}</b>`;
				return `<div class="tub">${mii(u)}<div><div class="mulabel">${label}</div>${who}${extra || ''}</div></div>`;
			};
			const menu =
				entry('Uploader', up,
					info.uploaded_pretty ? `<div class="ufield">Uploaded: <b>${esc(info.uploaded_pretty)}</b></div>` : '') +
				entry('First clear', info.first_completer) +
				entry('World record', info.record_holder,
					info.world_record_pretty ? `<div class="ufield">World record: <b>${esc(info.world_record_pretty)}</b></div>` : '');
			// same level stats as the panel's Stats grid; long values get a full row
			const stat = (l, v, wide) => (v === undefined || v === null || v === '')
				? '' : `<div class="tsi${wide ? ' wide' : ''}">${l}: <b>${esc(v)}</b></div>`;
			const stats = [
				stat('Uploaded', info.uploaded_pretty, true),
				stat('Plays', info.plays?.toLocaleString()),
				stat('Clears', info.clears?.toLocaleString()),
				stat('Clear rate', info.clear_rate_pretty),
				stat('Likes', info.likes?.toLocaleString()),
				stat('Boos', info.boos?.toLocaleString()),
				stat('Comments', info.num_comments?.toLocaleString()),
				stat('Clear time', wasmClearTime, true),
			].filter(Boolean).join('');
			const body = menu + (stats
				? `<div class="tustats"><div class="mulabel">Stats</div><div class="tsgrid">${stats}</div></div>`
				: '');
			return card + (body ? `<div class="tumenu"><div class="tumenuin">${body}</div></div>` : '');
		}

		function downloadBlob(blob, name) {
			const a = document.createElement('a');
			a.href = URL.createObjectURL(blob);
			a.download = name;
			a.click();
			setTimeout(() => URL.revokeObjectURL(a.href), 5000);
		}

		// ------------------------------------------------------------------
		// Maker profile and Super World panels. Sidebar swaps between the
		// level info view and these; data comes straight from tgrcode with
		// the shared cache.
		// ------------------------------------------------------------------

		function statGrid(pairs) {
			return `<div class='statgrid'>` + pairs.filter(Boolean)
				.map(([l, v]) => `<div class='ufield'>${l}: <b>${esc(v)}</b></div>`).join('') + `</div>`;
		}

		function courseList(courses) {
			return `<div class='levellist'>` + courses.map(c =>
				`<button class="courselink" data-course="${esc(c.course_id)}">` +
				`<b>${esc(c.name || '(unnamed)')}</b><br>` +
				`<span class="lmeta">${esc(c.difficulty_name || '?')} · ${esc(c.course_id)} · ` +
				`${(c.plays ?? 0).toLocaleString()} plays · ${esc(c.clear_rate_pretty || '0%')} cleared</span></button>`
			).join('') + `</div>`;
		}

		async function showMaker(makerCode) {
			const info = $('info');
			openInfoPanel();
			info.innerHTML = "<div class='row'>Loading maker profile...</div>";
			try {
				const u = await fetchCachedJson(`https://tgrcode.com/mm2/user_info/${makerCode}`);
				const posted = await fetchCachedJson(`https://tgrcode.com/mm2/get_posted/${makerCode}`).catch(() => null);
				const versus = u.versus_won !== undefined
					? statGrid([['Versus wins', (u.versus_won ?? 0).toLocaleString()], ['Versus losses', (u.versus_lost ?? 0).toLocaleString()],
						['Versus kills', (u.versus_kills ?? 0).toLocaleString()], ['Versus killed by others', (u.versus_killed_by_others ?? 0).toLocaleString()]])
					: '';

					['Easy highscore', u.easy_highscore], ['Normal highscore', u.normal_highscore],
					['Expert highscore', u.expert_highscore], ['Super Expert highscore', u.super_expert_highscore]]);
				const badges = (u.badges || []).map(b =>
					`<div class='ufield'>${esc(b.name || 'Badge')}${b.image ? ` <img src="${esc(b.image)}" referrerpolicy="no-referrer" style="height:14px;vertical-align:middle" onerror="this.remove()">` : ''}</div>`).join('');
				const sw = u.super_world_id

				info.innerHTML =

					`<div class='user'><img class="mii" src="${esc(u.mii_image || '')}" referrerpolicy="no-referrer" onerror="this.remove()"><div>` +
					`<div class='row'><b>${u.country ? `[${esc(u.country)}] ` : ''}${esc(u.name || makerCode)}</b></div>` +
					`<div class='ucode'>${esc(formatCode(makerCode))}</div></div></div>` +
					`<h2>Stats</h2>` +
					statGrid([
						['Levels played', (u.courses_played ?? 0).toLocaleString()],
						['Levels cleared', (u.courses_cleared ?? 0).toLocaleString()],
						['Attempts made', (u.courses_attempted ?? 0).toLocaleString()],
						['Deaths', (u.courses_deaths ?? 0).toLocaleString()],
						['First clears', (u.first_clears ?? 0).toLocaleString()],
						['Likes received', (u.likes ?? 0).toLocaleString()],
						['Maker points', (u.maker_points ?? 0).toLocaleString()],
						['World records', (u.world_records ?? 0).toLocaleString()],
						['Uploaded levels', (u.uploaded_levels ?? 0).toLocaleString()],
						['Last active', u.last_active_pretty || '?'],
					]) + versus + endless +
					(badges ? `<h2>Badges</h2>${badges}` : '') +
					(sw ? `<h2>Super World</h2>${sw}` : '') +
					(posted?.courses?.length ? `<h2>Uploaded levels (${posted.courses.length})</h2>` + courseList(posted.courses) : '');
			} catch (err) {
				info.innerHTML = `<div class='error'>Could not load maker profile: ${esc(err.message)}</div>` +
					`<button class="backbtn" id="backToLevel">← Back to level</button>`;

		async function showSuperWorld(swId) {
			const info = $('info');

		function openInfoPanel() {
			$('infoPanel').style.display = 'block';
		}

		function showLevel() {
			openInfoPanel();
			$('info').dataset.view = 'level';
			history.replaceState(null, '', currentLevelCode ? `?level=${currentLevelCode}` : location.pathname);
			if (currentLevelBytes) {
				$('info').innerHTML = buildInfo(cstr(ex.web_get_info_html()), onlineInfo);
			} else {
				$('info').innerHTML = "<div class='row'>Load a level to see info.</div>";
			}
		}

		// one delegated handler keeps all dynamically rendered panels clickable
		// (level info, maker profile, super world, live list)
		document.addEventListener('click', (e) => {
			const back = e.target.closest('#backToLevel');
			if (back) { showLevel(); return; }
			const maker = e.target.closest('.userlink');
			if (maker) { showMaker(maker.dataset.code); return; }
			const sw = e.target.closest('.swlink');
			if (sw) { showSuperWorld(sw.dataset.sw); return; }
			const course = e.target.closest('.courselink');
			if (course) {
				$('levelId').value = course.dataset.course;
				downloadLevel();
			}
		});

		function enableSaveButtons(on) {
			['saveOwPng', 'saveOwJson', 'saveSwPng', 'saveSwJson'].forEach(id => $(id).disabled = !on);
		}

		// ------------------------------------------------------------------
		// Input: left-drag pan, wheel zoom (anchored), hover highlight
		// ------------------------------------------------------------------

		function resizeCanvas() {
			// follow the real container size; artificial minimums made the canvas
			// overflow (and got clipped) on narrow windows
			const w = Math.max(50, canvas.parentElement.clientWidth);
			const h = Math.max(50, canvas.parentElement.clientHeight);
			if (canvas.width !== w || canvas.height !== h) {
				canvas.width = w;
				canvas.height = h;
				layoutHud();
				queueDraw();
			}
		}
		window.addEventListener('resize', () => { resizeCanvas(); queueDraw(); });

		// ------------------------------------------------------------------
		// Canvas HUD: per-viewport label + minimap, draggable split. Shown
		// only while a level is loaded; minimaps share the render pixel grid.
		// ------------------------------------------------------------------

		function layoutHud() {
			const hCut = Math.round(canvas.height * viewSplit);
			const anyLoaded = !!worlds[0].bitmap;
			$('splitter').style.display = anyLoaded ? 'block' : 'none';
			$('topLevelName').textContent = anyLoaded
				? (currentLevelCode ? currentLevelCode + ' · ' : '') + (onlineInfo?.name || '')
				: '';
			$('topNight').style.display = anyLoaded && (onlineInfo?.night_time || levelIsNight) ? 'inline' : 'none';
			const tu = $('topUserWrap');
			const cardHtml = anyLoaded ? buildTopUser() : '';
			if (tu.dataset.sig !== cardHtml) {
				tu.dataset.sig = cardHtml;
				tu.innerHTML = cardHtml;
			}
			tu.style.display = cardHtml ? 'flex' : 'none';
			$('splitter').style.top = hCut + 'px';
			[['exportOw', 0], ['exportSw', 1]].forEach(([id, i]) => {
				const el = $(id);
				el.style.display = anyLoaded ? 'flex' : 'none';
				const r = viewportRect(i);
				el.style.top = (r.vy + 8) + 'px';
			});
			[['miniOw', 0], ['miniSw', 1]].forEach(([id, i]) => {
				const m = $(id);
				const w = worlds[i];
				if (!anyLoaded || !w.bitmap) { m.style.display = 'none'; return; }
				m.style.display = 'block';
				const aspect = w.height / w.width;
				let mw = 140, mh = Math.round(mw * aspect);
				if (mh > 170) { mh = 170; mw = Math.round(mh / aspect); }
				if (mw > canvas.width - 20) { mw = canvas.width - 20; mh = Math.round(mw * aspect); }
				if (m.width !== mw || m.height !== mh) { m.width = mw; m.height = mh; }
				const r = viewportRect(i);
				m.style.left = '10px';
				m.style.top = (r.vy + 40) + 'px';
			});
		}

		function renderMinimaps(hCut) {
			if (!worlds[0].bitmap) return;
			worlds.forEach((w, i) => {
				const m = $(i === 0 ? 'miniOw' : 'miniSw');
				if (m.style.display === 'none') return;
				const mc = m.getContext('2d');
				mc.imageSmoothingEnabled = true;
				mc.clearRect(0, 0, m.width, m.height);
				mc.drawImage(w.bitmap, 0, 0, m.width, m.height);
				// viewport rectangle in world space -> minimap space
				const { vy, vh } = viewportRect(i);
				const vx = -w.offX / w.scale, vyw = -w.offY / w.scale;
				const vw = canvas.width / w.scale, vhw = vh / w.scale;
				const sx = m.width / w.width, sy = m.height / w.height;
				mc.strokeStyle = '#ff5040';
				mc.lineWidth = 1.5;
				mc.strokeRect(vx * sx, vyw * sy, vw * sx, vhw * sy);
			});
		}

		[['miniOw', 0], ['miniSw', 1]].forEach(([id, i]) => {
			$(id).addEventListener('click', (e) => {
				const w = worlds[i];
				if (!w.bitmap) return;
				const r = e.target.getBoundingClientRect();
				const wx = (e.clientX - r.left) / r.width * w.width;
				const wy = (e.clientY - r.top) / r.height * w.height;
				const { vy, vh } = worldAt(r.top + r.height / 2);
				w.offX = canvas.width / 2 - wx * w.scale;
				w.offY = vh / 2 - wy * w.scale;
				clampView(w, vy, vh);
				queueDraw();
			});
		});

		// topbar: viewport focus presets keep the splitter honest with one click
		function setFocusPreset(split) {
			viewSplit = split;
			layoutHud();
			const r0 = viewportRect(0), r1 = viewportRect(1);
			fitView(worlds[0], r0.vy, r0.vh);
			fitView(worlds[1], r1.vy, r1.vh);
			queueDraw();
		}
		function refreshFocusButtons() {
			$('focusOver').classList.toggle('active', viewSplit >= 0.79);
			$('focusSplit').classList.toggle('active', viewSplit > 0.21 && viewSplit < 0.79);
			$('focusSub').classList.toggle('active', viewSplit <= 0.21);
		}
		$('focusOver').onclick = () => { setFocusPreset(0.8); refreshFocusButtons(); };
		$('focusSplit').onclick = () => { setFocusPreset(0.5); refreshFocusButtons(); };
		$('focusSub').onclick = () => { setFocusPreset(0.2); refreshFocusButtons(); };
		$('topReset').onclick = () => setFocusPreset(0.5);
		$('infoBtn').onclick = () => {
			var p = $('infoPanel');
			if (p.style.display === 'block' && $('info').dataset.view === 'level') {
				p.style.display = 'none';
				infoPanelDismissed = true;
				return;
			}
			infoPanelDismissed = false;
			showLevel();
		};
		$('infoClose').onclick = () => { $('infoPanel').style.display = 'none'; infoPanelDismissed = true; };

		let splitDragging = false;
		$('splitter').addEventListener('mousedown', (e) => { splitDragging = true; e.preventDefault(); });
		window.addEventListener('mousemove', (e) => {
			if (!splitDragging) return;
			const r = canvas.getBoundingClientRect();
			viewSplit = Math.min(0.8, Math.max(0.2, (e.clientY - r.top) / r.height));
			layoutHud();
			refreshFocusButtons();
			queueDraw();
		});
		window.addEventListener('mouseup', () => { splitDragging = false; });

		canvas.addEventListener('mousedown', (e) => {
			if (e.button !== 0) return;
			dragging = true;
			dragLast = { x: e.offsetX, y: e.offsetY };
		});
		window.addEventListener('mouseup', () => { dragging = false; });
		canvas.addEventListener('mousemove', (e) => {
			const { i, vy, vh } = worldAt(e.offsetY);
			const w = worlds[i];

			if (dragging) {
				// pan inside the viewport only; the page itself never moves
				w.offX += e.offsetX - dragLast.x;
				w.offY += e.offsetY - dragLast.y;
				clampView(w, vy, vh);
			}
			dragLast = { x: e.offsetX, y: e.offsetY };

			if (w.bitmap) {
				const tx = Math.floor((e.offsetX - w.offX) / (TILE * w.scale));
				const ty = Math.floor((e.offsetY - vy - w.offY) / (TILE * w.scale));
				w.hoverTile = (tx >= 0 && ty >= 0 && tx < w.width / TILE && ty < w.height / TILE)
					? { x: tx, y: ty } : null;
				$('coords').textContent = w.hoverTile ? `${worldNames[i]} tile (${tx}, ${ty})` : '';
			}
			updateBubble(e.offsetX, e.offsetY, i, vy);
			queueDraw();
		});

		function updateBubble(mx, my, worldIdx, vy) {
			const bubble = $('bubble');
			const w = worlds[worldIdx];
			if (!w.bitmap || !overlays[worldIdx].marks.length) {
				bubble.style.display = 'none';
				return;
			}
			const hitR = Math.max(10, 8 * w.scale);
			let hit = null;
			for (const m of overlays[worldIdx].marks) {
				const sx = w.offX + m.px * w.scale;
				const sy = vy + w.offY + m.py * w.scale;
				if ((mx - sx) ** 2 + (my - sy) ** 2 <= hitR * hitR) { hit = { m, sx, sy }; break; }
			}
			if (!hit) { bubble.style.display = 'none'; return; }
			const body = hit.m.text
				? hit.m.text.replace(/&/g, '&amp;').replace(/</g, '&lt;')
				: `(${hit.m.type})`;
			const meta = [hit.m.poster, hit.m.when, hit.m.beaten ? 'cleared after posting' : '']
				.filter(Boolean).join(' · ');
			bubble.innerHTML = `${body}<div class="meta">${meta}</div>`;
			bubble.style.display = 'block';
			const bw = bubble.offsetWidth, bh = bubble.offsetHeight;
			bubble.style.left = Math.min(Math.max(hit.sx - bw / 2, 4), canvas.clientWidth - bw - 4) + 'px';
			bubble.style.top = Math.max(hit.sy - bh - 12, 4) + 'px';
		}

		canvas.addEventListener('mouseleave', () => {
			worlds.forEach(w => w.hoverTile = null);
			$('coords').textContent = '';
			$('bubble').style.display = 'none';
			queueDraw();
		});
		// double-click a viewport (or press R) to snap back to the fitted view
		canvas.addEventListener('dblclick', (e) => {
			const { i, vy, vh } = worldAt(e.offsetY);
			fitView(worlds[i], vy, vh);
			queueDraw();
		});
		window.addEventListener('keydown', (e) => {
			if (e.key !== 'r' && e.key !== 'R') return;
			if (document.activeElement && ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
			const r0 = viewportRect(0), r1 = viewportRect(1);
			fitView(worlds[0], r0.vy, r0.vh);
			fitView(worlds[1], r1.vy, r1.vh);
			queueDraw();
		});
		canvas.addEventListener('wheel', (e) => {
			e.preventDefault();
			const { i, vy, vh } = worldAt(e.offsetY);
			const w = worlds[i];
			if (!w.bitmap) return;

			const factor = e.deltaY < 0 ? 1.2 : 1 / 1.2;
			const mx = e.offsetX, my = e.offsetY - vy;
			const nx = mx - (mx - w.offX) * factor;
			const ny = my - (my - w.offY) * factor;
			w.offX = nx;
			w.offY = ny;
			w.scale *= factor;
			clampView(w, vy, vh);
			queueDraw();
		}, { passive: false });

		// ------------------------------------------------------------------
		// Controls
		// ------------------------------------------------------------------

		function enableControls() {
			$('loadBtn').disabled = false;
			$('downloadBtn').disabled = false;
			$('randomBtn').disabled = false;
			$('liveHotBtn').disabled = false;
			$('liveListBtn').disabled = false;
		}

		$('loadBtn').onclick = () => $('fileInput').click();
		$('fileInput').onchange = function () {
			if (!this.files.length) return;
			onlineInfo = null;
			const reader = new FileReader();
			reader.onload = () => loadFromBytes(new Uint8Array(reader.result), null);
			reader.readAsArrayBuffer(this.files[0]);
		};

		async function downloadLevel() {
			const raw = $('levelId').value.trim().replace(/[- ]/g, '').toUpperCase();
			if (!/^[0-9BCDFGHJKLMNPQRSTVWXY]{9}$/.test(raw)) {
				$('info').innerHTML = `<div class='error'>Level ID ${raw || '(empty)'} is not of the right format</div>`;
				return;
			}
			$('info').innerHTML = "<div class='row'>Downloading...</div>";
			try {
				// level_info goes through the shared cache so a cold-boot burst
				// (data + info + thumbnail at once) can 429 it into nowhere and
				// silently drop the topbar user card; backoff keeps it alive
				const [dataResp, info] = await Promise.all([
					fetch(`https://tgrcode.com/mm2/level_data/${raw}`),
					fetchCachedJson(`https://tgrcode.com/mm2/level_info/${raw}`).catch(() => null)
				]);
				if (!dataResp.ok) throw new Error('HTTP ' + dataResp.status);
				onlineInfo = info;
				await loadFromBytes(new Uint8Array(await dataResp.arrayBuffer()), raw);
			} catch (err) {
				onlineInfo = null;
				$('info').innerHTML = `<div class='error'>Could not download level ${raw}: ${err.message}</div>`;
			}
		}
		$('downloadBtn').onclick = downloadLevel;
		$('levelId').addEventListener('keydown', (e) => { if (e.key === 'Enter') downloadLevel(); });

		async function randomLevel() {
			$('randomBtn').disabled = true;
			$('info').innerHTML = "<div class='row'>Finding a level...</div>";
			try {
				const source = $('randomSource').value;
				const diff = $('randomDifficulty').value;
				let url = `https://tgrcode.com/mm2/search_${source}?count=1`;
				if (source !== 'new' && diff) url += `&difficulty=${diff}`;
				// never reuse a cached pick — each click should surface a new level
				const r = await fetch(url);
				if (!r.ok) throw new Error('HTTP ' + r.status);
				const d = await r.json();
				const course = d.courses?.[0];
				if (!course?.course_id) throw new Error('no course returned');
				$('levelId').value = course.course_id;
				onlineInfo = course; // search already returns the full level_info shape
				const resp = await fetch(`https://tgrcode.com/mm2/level_data/${course.course_id}`);
				if (!resp.ok) throw new Error('HTTP ' + resp.status);
				await loadFromBytes(new Uint8Array(await resp.arrayBuffer()), course.course_id);
			} catch (err) {
				$('info').innerHTML = `<div class='error'>Could not fetch a random level: ${err.message}</div>`;
			}
			$('randomBtn').disabled = false;
		}
		$('randomBtn').onclick = randomLevel;

		// ------------------------------------------------------------------
		// Live feed (wizulus): courses being viewed by others right now.
		// The feed rolls every minute, so its cache TTL is short.
		// ------------------------------------------------------------------

		let liveCache = null; // { at, courses }
		async function fetchLive() {
			if (liveCache && Date.now() - liveCache.at < 30000) return liveCache.courses;
			const r = await fetch('https://cdn.wizulus.com/api/live-courses');
			if (!r.ok) throw new Error('HTTP ' + r.status);
			const d = await r.json();
			liveCache = { at: Date.now(), courses: d.courses || [] };
			return liveCache.courses;
		}

		function relTime(iso) {
			const s = Math.max(0, (Date.now() - new Date(iso).getTime()) / 1000);
			if (s < 90) return 'just now';
			if (s < 3600) return Math.round(s / 60) + 'm ago';
			return Math.round(s / 3600) + 'h ago';
		}

		async function loadLiveHot() {
			$('liveHotBtn').disabled = true;
			$('info').innerHTML = "<div class='row'>Finding the hottest level...</div>";
			try {
				const courses = await fetchLive();
				const top = courses[0];
				if (!top) throw new Error('feed is empty');
				$('levelId').value = top.courseId;
				onlineInfo = null;
				const resp = await fetch(`https://tgrcode.com/mm2/level_data/${top.courseId.replace(/-/g, '')}`);
				if (!resp.ok) throw new Error('HTTP ' + resp.status);
				await loadFromBytes(new Uint8Array(await resp.arrayBuffer()), top.courseId.replace(/-/g, ''));
			} catch (err) {
				$('info').innerHTML = `<div class='error'>Live feed unavailable: ${err.message}</div>`;
			}
			$('liveHotBtn').disabled = false;
		}
		$('liveHotBtn').onclick = loadLiveHot;

		async function toggleLiveList() {
			const panel = $('infoPanel');
			const opening = panel.style.display !== 'block';
			panel.style.display = 'block';
			if (!opening && $('info').dataset.view === 'live') { panel.style.display = 'none'; return; }
			$('info').dataset.view = 'live';
			$('info').innerHTML = '<div class="row">Loading live list…</div>';
			try {
				const courses = await fetchLive();
				if ($('info').dataset.view !== 'live') return; // user switched away meanwhile
				$('info').innerHTML =
					'<div class="row"><b>Watched right now</b></div>' +
					'<div class="levellist">' + courses.map((c, i) =>
						`<button class="courselink" data-course="${esc(c.courseId)}">` +
						`<b>${i === 0 ? '🔥 ' : ''}${esc(c.courseId)}</b> ` +
						`<span class="lmeta">· ${relTime(c.lastViewedAt)} · hot ${Number(c.hotScore).toFixed(2)}</span></button>`
					).join('') + '</div>';
			} catch (err) {
				if ($('info').dataset.view === 'live')
					$('info').innerHTML = `<div class="error">Live feed unavailable: ${esc(err.message)}</div>`;
			}
		}
		$('liveListBtn').onclick = toggleLiveList;

		function rerender() {
			if (!worlds[0].bitmap) return;
			loadFromBytes(currentLevelBytes, currentLevelCode);
		}
		$('removeGrid').onchange = function () {
			ex.web_set_options(this.checked ? 1 : 0, $('objectsOverPipes').checked ? 1 : 0);
			rerender();
		};
		$('objectsOverPipes').onchange = function () {
			ex.web_set_options($('removeGrid').checked ? 1 : 0, this.checked ? 1 : 0);
			rerender();
		};
		$('imageScale').onchange = function () {
			ex.web_set_image_scale(parseFloat(this.value) || 1);
			rerender();
		};

		$('deathsOverlay').onchange = refreshOverlays;
		$('commentsOverlay').onchange = refreshOverlays;
		$('compareOfficial').onchange = () => { $('bubble').style.display = 'none'; queueDraw(); };

		// Save PNG composites the active overlay layer (death heatmap / comment
		// pins) on top so a saved render tells the same story as the screen.
		function savePng(worldIdx) {
			const w = worlds[worldIdx];
			if (!w.png) return;
			const name = worldIdx === 0 ? 'overworld.png' : 'subworld.png';
			const overlayActive = overlays[worldIdx].bitmap
				&& ($('deathsOverlay').checked || $('commentsOverlay').checked);
			if (!overlayActive) {
				downloadBlob(new Blob([w.png], { type: 'image/png' }), name);
				return;
			}
			const c = document.createElement('canvas');
			c.width = w.width;
			c.height = w.height;
			const cx = c.getContext('2d');
			cx.drawImage(w.bitmap, 0, 0);
			cx.drawImage(overlays[worldIdx].bitmap, 0, 0);
			c.toBlob(b => downloadBlob(b, name), 'image/png');
		}
		$('saveOwPng').onclick = () => savePng(0);
		$('saveSwPng').onclick = () => savePng(1);
		$('saveOwJson').onclick = () => downloadBlob(new Blob([cstr(ex.web_get_json(0))], { type: 'application/json' }), 'overworld.json');
		$('saveSwJson').onclick = () => downloadBlob(new Blob([cstr(ex.web_get_json(1))], { type: 'application/json' }), 'subworld.json');

		// ------------------------------------------------------------------
		// Boot
		// ------------------------------------------------------------------

		resizeCanvas();
		try {
			ex = await loadWasm();
		} catch (err) {
			$('loading').textContent = 'Failed to load: ' + err.message;
			throw err;
		}
		enableControls();
		$('loading').style.display = 'none';

		// share links: ?level=CODE renders on open; ?maker=CODE / ?super=ID open panels
		const params = new URLSearchParams(location.search);
		const shared = params.get('level');
		if (shared && /^[0-9BCDFGHJKLMNPQRSTVWXY]{9}$/.test(shared)) {
			$('levelId').value = shared;
			downloadLevel();
		} else if (params.get('maker')) {
			showMaker(params.get('maker'));
		} else if (params.get('super')) {
			showSuperWorld(params.get('super'));
		}
	</script>
</body>

</html>
